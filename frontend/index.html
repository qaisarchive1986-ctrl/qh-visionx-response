<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QH VisionX Response</title>

  <meta
    name="description"
    content="QH VisionX Response — Emergency Response and GIS Platform"
  >

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    header {
      padding: 18px;
      background: #111c30;
      border-bottom: 1px solid #263552;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      color: #aebbd0;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: #111c30;
      border: 1px solid #263552;
      border-radius: 16px;
      padding: 20px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .value {
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: #1976d2;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: .9;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #17243b;
    }
  </style>
</head>

<body>

<header>
  <h1>QH VisionX Response</h1>
  <p>سامانه مدیریت حوادث، GIS و پاسخ اضطراری</p>
</header>

<main>

  <section class="grid">

    <div class="card">
      <h2>حوادث فعال</h2>
      <div class="value" id="incidents">0</div>
    </div>

    <div class="card">
      <h2>تیم‌های فعال</h2>
      <div class="value" id="teams">0</div>
    </div>

    <div class="card">
      <h2>موقعیت‌های GPS</h2>
      <div class="value" id="gps">0</div>
    </div>

    <div class="card">
      <h2>وضعیت سیستم</h2>
      <div class="value" id="system">ONLINE</div>
    </div>

  </section>

  <section class="card" style="margin-top:20px">

    <h2>GPS دستگاه</h2>

    <button onclick="getLocation()">
      دریافت موقعیت من
    </button>

    <div id="status">
      آماده دریافت موقعیت...
    </div>

  </section>

</main>

<script>

function getLocation() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {

    status.textContent =
      "مرورگر شما از GPS پشتیبانی نمی‌کند.";

    return;
  }

  status.textContent =
    "در حال دریافت موقعیت...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      status.innerHTML =
        "Latitude: " + latitude +
        "<br>Longitude: " + longitude;

      document.getElementById("gps")
        .textContent = "1";

    },

    function(error) {

      status.textContent =
        "دسترسی به موقعیت امکان‌پذیر نیست.";

      console.error(error);

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
